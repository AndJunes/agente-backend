# Como se ejecuta Mirag en un servidor. El Dockerfile dice QUE hay dentro; esto dice con
# cuanto poder corre, que es lo que de verdad decide si un despliegue es seguro.
#
# El modelo de amenaza, en una linea: este agente EJECUTA codigo que escribe un LLM a
# peticion de quien abra la pagina, y NO TIENE AUTENTICACION. Todo lo de abajo asume que
# ese codigo es hostil, porque para el caso lo es.

# Dos destinos desde el mismo Dockerfile. `mirag` es el de siempre, sin una sola
# dependencia. `mirag-identidad` añade stellar-sdk y solo arranca si lo pides:
#   docker compose up -d                            → la imagen limpia
#   docker compose --profile identidad up -d        → la que habla con Stellar
services:
  mirag:
    build:
      context: .
      target: base
    image: mirag:base
    container_name: mirag

    # 127.0.0.1 EN EL LADO DEL HOST, y esto es lo mas importante del archivo.
    # `- "8000:8000"` a secas publica en TODAS las interfaces de la maquina y, en un VPS,
    # eso es tu agente abierto a internet sin contraseña. Con el prefijo 127.0.0.1 el
    # puerto solo existe para la propia maquina, y se llega por tunel SSH o por Tailscale.
    ports:
      - "127.0.0.1:8000:8000"


    # La clave NO se escribe aqui. Un docker-compose.yml acaba en git; un .env, no.
    # Tampoco se usa `env_file`, y el motivo es concreto: env_file mete el .env ENTERO,
    # incluida STELLAR_SECRET_KEY, que este contenedor no necesita para nada (ver abajo).
    # Con `${VAR}` Compose lee el mismo .env pero entra SOLO lo que se nombra aqui.
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      MIRAG_HOST: 0.0.0.0        # dentro del contenedor; ver el comentario del Dockerfile
      MIRAG_OFFLINE: "1"         # "0" para respuestas reales, y entonces hace falta clave
      LIMITE_USD: "0.50"         # tope por peticion: el agente corta antes de pasarse
      MIRAG_EJECUCION: "off"     # genera codigo y tests, no los corre. Eso es de QA.
      # Modelo gratuito para la prueba de concepto. Quita esta linea para volver al de
      # pago. Limite del gratuito: 20 peticiones/minuto y 50/dia (1.000 si compraste 10 $).
      MIRAG_MODELO: "openrouter/free"
      # Secreto compartido con el servidor de CodeZard, que lo manda en X-Mirag-Token.
      # Vacio = abierto a quien alcance el puerto, y el arranque lo dice. No hay token por
      # defecto a proposito: un secreto de fabrica lo sabe todo el mundo.
      MIRAG_TOKEN: "${MIRAG_TOKEN:-}"

    # ── Contencion ────────────────────────────────────────────────────────────────
    # no-new-privileges: ni un `sudo` ni un binario setuid pueden escalar desde dentro.
    security_opt:
      - no-new-privileges:true

    # Sin una sola capability. Este proceso abre un socket y lee archivos; no necesita
    # poder cambiar la hora del sistema, montar nada ni tocar la red cruda.
    cap_drop:
      - ALL

    # /tmp es donde `skills.verificar_codigo` escribe y ejecuta lo que genera el modelo.
    # En tmpfs: vive en RAM, muere con el contenedor y no deja rastro en el disco del host.
    #   noexec  → no se pueden ejecutar BINARIOS desde ahi. Un `python3 test.py` sigue
    #             funcionando, porque ahi quien ejecuta es el interprete, que vive en
    #             /usr/local/bin; lo de /tmp es solo un archivo que se lee. Comprobado.
    #   nosuid  → un binario setuid dejado ahi no sirve de nada.
    #   size    → un bucle que escriba sin parar llena 64 MB de RAM y muere, no el disco.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # Techos. Sin esto, un `while True: fork()` o un minero de cripto en el codigo generado
    # se lleva por delante la maquina entera, no solo el contenedor.
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5

    restart: unless-stopped

    # Los logs tambien crecen sin techo si nadie lo dice.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # La misma imagen + stellar-sdk. Solo con `--profile identidad`.
  mirag-identidad:
    profiles: ["identidad"]
    build:
      context: .
      target: identidad
    image: mirag:identidad
    container_name: mirag-identidad
    ports:
      - "127.0.0.1:8001:8000"

    # AQUI ESTA LO IMPORTANTE, y es una propiedad medida, no una precaucion:
    # para MOSTRAR la identidad solo se hacen lecturas sin firmar
    # (blockchain/stellar/client.py:121-130), asi que bastan la clave PUBLICA y el id.
    # La semilla solo hace falta en `invocar()` (client.py:133), que solo llaman
    # registro.registrar() y registro.asociar_wallet(), y a esos solo los llama el demo
    # con --registrar. Registrar es una operacion manual, local y de una vez.
    # Por eso STELLAR_SECRET_KEY no aparece aqui: el contenedor no la necesita nunca.
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      MIRAG_HOST: 0.0.0.0
      MIRAG_OFFLINE: "1"
      LIMITE_USD: "0.50"
      MIRAG_BLOCKCHAIN: testnet
      STELLAR_PUBLIC_KEY: "${STELLAR_PUBLIC_KEY:-}"
      STELLAR_AGENT_ID: "${STELLAR_AGENT_ID:-}"

    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    tmpfs: [ "/tmp:rw,noexec,nosuid,size=64m" ]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
