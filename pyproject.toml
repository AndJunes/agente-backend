[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirag"
version = "2.0.0"
description = "Backend engineering agent that retrieves, generates, executes and proves what it delivers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mirag team" }]
# The core runtime is standard library only. This is a design constraint, not an accident.
dependencies = []

[project.optional-dependencies]
blockchain = ["stellar-sdk>=16.1.0"]
dev = ["ruff>=0.6", "mypy>=1.10"]

[project.scripts]
mirag = "mirag.cli:main"
mirag-pm = "mirag_pm.cli:main"
mirag-manager = "mirag_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirag = [
    "locales/*/*.json",
    "knowledge/*/*.md",
    "resources/*.json",
    "web/*.html",
]
# The PM corpus is nested one level deeper than mirag's: its documents live in domain folders
# (`06-requirements/prd.md`), not as numbered files in one directory, so the globs differ.
mirag_pm = [
    "locales/*/*.json",
    "knowledge/*/*.md",
    "knowledge/*/*/*.md",
    "skills/*.md",
    "skills/*/*.md",
    "examples/*/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
    "E501",    # long strings in prompts and messages are fine; the formatter handles code
    "RUF001",  # the UI and messages legitimately use typographic characters
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
files = ["src/mirag", "src/mirag_pm", "src/mirag_manager"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
