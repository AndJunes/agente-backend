[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirag"
version = "2.0.0"
description = "Backend engineering agent that retrieves, generates, executes and proves what it delivers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mirag team" }]
# The core runtime is standard library only. This is a design constraint, not an accident:
# tests/architecture/test_dependencies.py fails if a core module imports a third-party package.
dependencies = []

[project.optional-dependencies]
blockchain = ["stellar-sdk>=16.1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
mirag = "mirag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirag = [
    "locales/*/*.json",
    "knowledge/*/*.md",
    "resources/*.json",
    "web/*.html",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# Fast by default: `slow` tests spawn interpreters and HTTP servers. Run them with
# `pytest -m "slow or not slow"` (CI does) or `make test-all`.
addopts = '-ra --strict-markers -m "not slow and not network"'
markers = [
    "slow: runs real subprocesses or HTTP servers (seconds, not milliseconds)",
    "network: talks to a real external network; skipped unless explicitly enabled",
]
filterwarnings = ["error::DeprecationWarning:mirag.*"]

[tool.coverage.run]
source = ["mirag"]
omit = ["src/mirag/integrations/blockchain/stellar/*", "src/mirag/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
    "E501",    # long strings in prompts and messages are fine; the formatter handles code
    "RUF001",  # the UI and messages legitimately use typographic characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/mirag"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
